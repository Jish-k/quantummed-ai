apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: quantummed
    component: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantummed
      component: mlflow
  template:
    metadata:
      labels:
        app: quantummed
        component: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow
        command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  selector:
    app: quantummed
    component: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
